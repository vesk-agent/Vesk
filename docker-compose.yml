# Run Vesk 24/7.
#   1. One-time setup (interactive, writes ./vesk/keystore.json and ./vesk/vesk.config.yaml):
#        docker compose run --rm vesk init
#   2. Put VESK_PASSPHRASE (and any model / X / Telegram keys) in ./vesk.env, chmod 600.
#   3. docker compose up -d && docker compose logs -f
# Paper mode is the default after init. Add "--live" to the command only when you mean it.
services:
  vesk:
    build: .
    image: vesk-agent:local
    restart: unless-stopped
    command: ["summon", "--stream"]
    env_file:
      - path: ./vesk.env
        required: false
    environment:
      VESK_HOME: /data
    volumes:
      - ./vesk:/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
